server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        error_page 418 = @social_og_home;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Zalo|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot)") {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/@([^/]+)/edit/?$ {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/@([^/]+)/?$ {
        error_page 418 = @social_og_user;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Zalo|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot)") {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/@([^/]+)/(?!edit/?$)([^/]+)/?$ {
        error_page 418 = @social_og_slug;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Zalo|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot)") {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @social_og_home {
        rewrite ^/$ /api/public/og/home break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location @social_og_user {
        rewrite ^/@([^/]+)/?$ /api/public/og/u/$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location @social_og_slug {
        rewrite ^/@([^/]+)/([^/]+)/?$ /api/public/og/u/$1/$2 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
