server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: portfolio-backend
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:portfolio_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3005}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3005,http://localhost:5173,http://localhost:5175,http://localhost:3000,http://localhost:8080}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-super-secret-jwt-key-minimum-32-characters-long-2026}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin123}
  google:
    client-id: ${APP_GOOGLE_CLIENT_ID:}
  mail:
    from: ${APP_MAIL_FROM:}
  password-reset:
    expiration-minutes: ${APP_PASSWORD_RESET_EXPIRATION_MINUTES:30}
  rate-limit:
    enabled: true
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_API_BASE_URL:http://host.docker.internal:20128/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:kr/claude-sonnet-4.5}
    rewrite-localhost-in-docker: ${AI_REWRITE_LOCALHOST:true}
